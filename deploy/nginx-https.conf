# Included from Nginx's http context. These zones apply only to this server.
limit_req_zone $binary_remote_addr zone=folio_requests:1m rate=20r/s;
limit_conn_zone $server_name zone=folio_connections:1m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name folio.flandolf.me;

    # Visitor IPs are accepted only from Cloudflare's published proxy ranges.
    # https://www.cloudflare.com/ips/ (verified 2026-10-05; review on upgrades).
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    ssl_certificate /etc/letsencrypt/live/folio.flandolf.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/folio.flandolf.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/folio-releases.access.log;
    error_log /var/log/nginx/folio-releases.error.log;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 100;
    limit_req zone=folio_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn folio_connections 128;
    limit_conn_status 503;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($http_content_length !~ "^(|0)$") { return 400; }
        if ($http_transfer_encoding != "") { return 400; }
        # The updater needs single ranges only; enforce this in Go as well.
        if ($http_range ~ ",") { return 416; }
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host folio.flandolf.me;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        send_timeout 60s;
        # Stream APKs without filling Nginx's temporary-file directory.
        proxy_buffering off;
    }
}
