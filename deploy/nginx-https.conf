server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name folio.flandolf.me;

    ssl_certificate /etc/letsencrypt/live/folio.flandolf.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/folio.flandolf.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/folio-releases.access.log;
    error_log /var/log/nginx/folio-releases.error.log;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host folio.flandolf.me;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        send_timeout 60s;
        # Stream APKs without filling Nginx's temporary-file directory.
        proxy_buffering off;
    }
}
