# Certbot's HTTP-01 challenge is served independently of the Go service.
server {
    listen 80;
    listen [::]:80;
    server_name folio.flandolf.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/folio-acme;
    }

    location / {
        return 301 https://folio.flandolf.me$request_uri;
    }
}
